<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen · TINT Impactmonitor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ff;--surface:#fff;--ink:#1f1d2b;--muted:#5e5a73;--line:#dcd6f5;--accent:#604ce2;--accent-text:#4f3bc7;--green:#25e579;--bad:#b3372a;--bad-soft:#fbe3df;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#1f1d2b;--surface:#2a2739;--ink:#f3f0ff;--muted:#b4aecb;--line:#3d3952;--accent:#8c7cf0;--accent-text:#b3a8ff;--bad:#f19a8c;--bad-soft:#47262a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",Arial,sans-serif;padding:16px;border-top:6px solid var(--accent)}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
h1{font-weight:800;font-size:1.4rem;margin:0 0 4px;color:var(--accent-text)}
h1 span{color:var(--muted);font-weight:700;font-size:1rem}
p{color:var(--muted);margin:0 0 20px;font-size:.95rem}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input:focus{outline:3px solid var(--green);outline-offset:1px}
button{margin-top:16px;width:100%;font:inherit;font-weight:700;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{display:none;margin-top:14px;padding:9px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:.9rem}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>TINT Achterhoek <span>· Impactmonitor</span></h1>
  <p>Log in met het wachtwoord dat je van TINT hebt gekregen.</p>
  <label for="pw">Wachtwoord</label>
  <input type="password" id="pw" autocomplete="current-password" required autofocus>
  <button type="submit" id="go">Inloggen</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.style.display = 'none';
  try {
    const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ wachtwoord: document.getElementById('pw').value }) });
    if (r.ok) { location.href = '/'; return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = j.error || 'Inloggen mislukt.';
  } catch { err.textContent = 'Geen verbinding met de server.'; }
  err.style.display = 'block'; btn.disabled = false;
});
</script>
</body>
</html>
